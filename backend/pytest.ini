[pytest]
pythonpath = . backend
DJANGO_SETTINGS_MODULE = backend.settings

# async-Tests (test_consumers.py) ohne Extra-Marker-Pflege ausführen
asyncio_mode = auto

# Wo pytest nach Tests sucht
testpaths = tests

# Continue running collected tests after TDD tests fail to import unimplemented modules,
# and report uncovered lines for the backend package.
addopts = -ra --continue-on-collection-errors --cov=backend --cov-config=.coveragerc --cov-report=term-missing --cov-report=html
